<!DOCTYPE html>
<html lang="ja" data-theme="auto">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=yes">

<!-- ▼ 安全のための せいげん（Content-Security-Policy）

     Typa は 外の サイトから 何も 読まず、どこへも おくりません。
     その ことを ブラウザに 宣言して、まんいち 中身が すりかわっても
     外への つながりが できないように します。

     ・script-src 'self' … 外の スクリプトも、この HTML の 中に 直接 書いた
       <script> も、onclick= も 動きません。だから 本体は ぜんぶ js/ の
       ファイルに 分けて あり、インストールの 合図も install-hook.js に して
       あります（下を 見て ください）。ここは しめた ままに します。
     ・connect-src 'self' … 通信は しません。'self' も 実さいには つかいません。

     ⚠️ style-src に だけ 'unsafe-inline' が 入って います。理由が あります。
        キーボードの 指の 色分けは、キー1つ ずつに style="--finger: …" を
        書いて 出して います（app.js・play.js・hands.js の 6か所）。
        style-src 'self' だけに すると これが ぜんぶ 止まり、
        **画面は ふつうに 出るのに 指の 色分けだけが 黙って 消えます**。
        エラーも 出ないので 気づけません（実さいに 入れて 走らせて 分かりました。
        コンソールに 27件 出ました）。
        script-src が しまって いれば、スタイルの インラインから 情報が
        持ち出される 経路は ありません。GIGA Standard v5 §2-13 の 見本も
        style-src には 'unsafe-inline' を 置いて います。

     ⚠️ frame-ancestors は ここには 書けません。
        <meta> で 書いても **無視され**、コンソールに 警告が 出るだけです。
        ほかの サイトへの うめこみを 止めるには HTTP ヘッダーが 要りますが、
        GitHub Pages では 足せません。独自ドメインや CDN を はさむ ときに
        サーバー側で `frame-ancestors 'self'` を 足して ください。 -->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  script-src 'self';
  style-src 'self' 'unsafe-inline';
  img-src 'self' data:;
  font-src 'self';
  connect-src 'self';
  frame-src 'self' https://gamification.giga-school.com;
  worker-src 'self';
  manifest-src 'self';
  object-src 'none';
  base-uri 'self';
  form-action 'self';
">

<!-- ① インストールの 合図を いちばん 先に 受け取ります。
     Chrome は 条件が そろうと すぐに beforeinstallprompt を 出すので、
     19本の スクリプトの さいごに ある app.js で 受けて いた ころは
     通信が おそい 端末で 合図を 取りこぼし、「ホーム画面に 入れる」ボタンが
     出ない ことが ありました。CSP に 'unsafe-inline' を 足さずに すむよう、
     この HTML の 中では なく 小さな 外の ファイルにして 同期で 読みます。 -->
<script src="./install-hook.js"></script>

<title>Typa（タイパ） — タイピングれんしゅう</title>
<meta name="description" content="小学生の Chromebook のための タイピング学習アプリ。どの指で どのキーを 押すかを 見ながら、ローマ字入力と ショートカットキーを 練習できます。">
<meta property="og:type" content="website">
<meta property="og:site_name" content="GIGA school">
<meta property="og:locale" content="ja_JP">
<meta property="og:title" content="Typa（タイパ） — タイピングれんしゅう">
<meta property="og:description" content="小学生の Chromebook のための タイピング学習アプリ。どの指で どのキーを 押すかを 見ながら、ローマ字入力と ショートカットキーを 練習できます。">
<meta property="og:url" content="https://typa.giga-school.com/">
<meta property="og:image" content="https://giga-school.com/assets/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="GIGA school｜学校で使える Web アプリ">
<meta name="twitter:card" content="summary_large_image">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#eef4fb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131a24" media="(prefers-color-scheme: dark)">

<!-- PWA（Chrome / Edge） -->
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/favicon-32.png" sizes="32x32">
<link rel="icon" href="./icons/icon-192.png" sizes="192x192">

<!-- PWA（Safari / iPadOS・iOS）。ホーム画面から 全画面で ひらきます -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Typa">
<!-- ⚠️ apple-touch-icon には 透明を ふくむ 画像を 指しません。
     iOS は 透明な ところを 黒で うめる ため、ホーム画面で アイコンの
     四すみ だけが 黒く 出ます。この 画像は 下地を はしまで のばして
     あり、透明は 0% です（icons/make_icons.py の mode='apple'）。 -->
<link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png">

<link rel="stylesheet" href="./css/style.css">
<!-- 見た目の たのしさと 階層（ヒーロー・ひきだし・アニメーション）。
     style.css の あとに よみます -->
<link rel="stylesheet" href="./css/fx.css">
</head>
<body data-screen="play">

<!-- レベルの わっかに つかう グラデーション。
     SVG の url(#…) は ページ全体から 引けるので、ここに 1つだけ おきます -->
<svg width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute">
  <defs>
    <linearGradient id="fx-ring-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="var(--primary)"/>
      <stop offset="100%" stop-color="var(--c-violet)"/>
    </linearGradient>
  </defs>
</svg>

<!-- 画面の はしから スワイプした ときに 出る しるし（「もどる」の 手ごたえ） -->
<div id="edge-hint" class="edge-hint" aria-hidden="true"><span class="edge-arrow"></span></div>

<!-- 大きい 画面のときだけ 出る うすい ブランド行。せまい 画面では 出さず、
     メインの コンテンツに 画面を いっぱい つかいます -->
<header class="brand" role="banner">
  <span class="brand-mark" aria-hidden="true">Typa</span>
  <span class="brand-note">キーボードと なかよく なろう</span>
</header>

<main id="view" class="view" role="main" tabindex="-1"></main>

<!-- 画面下の ナビゲーションバー。いちばん 左が「もどる」です -->
<nav class="navbar" role="navigation" aria-label="メインナビゲーション">
  <button id="nav-back" class="nav-btn nav-back" type="button">
    <svg class="ico" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5 8 12l7 7"/></svg>
    <span>もどる</span>
  </button>
  <!-- いちばん 左（もどるの つぎ）が「うつ」です。ひらいた ところが ここに なります -->
  <button class="nav-btn" type="button" data-tab="play">
    <svg class="ico" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="5.5" width="19" height="13" rx="2.5"/><path d="M6 9.5h.01M9.5 9.5h.01M13 9.5h.01M16.5 9.5h.01M6 13h.01M9.5 13h.01M13 13h.01M16.5 13h.01M8 16.2h8"/></svg>
    <span>うつ</span>
  </button>
  <button class="nav-btn" type="button" data-tab="menu">
    <svg class="ico" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="2.5"/><path d="M3.5 9.5h17M3.5 15h17M9.5 3.5v17M15 3.5v17"/></svg>
    <span>えらぶ</span>
  </button>
  <button class="nav-btn" type="button" data-tab="records">
    <svg class="ico" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V4"/><path d="M4 20h16"/><path d="M8 17v-5M12.5 17V8M17 17v-7"/></svg>
    <span>きろく</span>
  </button>
  <button class="nav-btn" type="button" data-tab="settings">
    <svg class="ico" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v2.6M12 18.6v2.6M21.2 12h-2.6M5.4 12H2.8M18.5 5.5l-1.8 1.8M7.3 16.7l-1.8 1.8M18.5 18.5l-1.8-1.8M7.3 7.3 5.5 5.5"/></svg>
    <span>せってい</span>
  </button>
</nav>

<div id="toast" class="toast-area" aria-live="polite"></div>

<!-- おいわいの ひらひらを 出す ところ。さわれません（打つ じゃまを しません） -->
<div id="fx-layer" class="fx-layer" aria-hidden="true"></div>

<script src="./js/icons.js"></script>
<script src="./js/fx.js"></script>
<script src="./js/layout.js"></script>
<script src="./js/romaji.js"></script>
<script src="./js/lessons.js"></script>
<script src="./js/mastery.js"></script>
<script src="./js/store.js"></script>
<!-- 学習ログ（study.v1）。studyLog.js は 8アプリで 中身が 同じ ファイルです。
     store.js の あと、play.js の 前に よみます -->
<script src="./js/studyLog.js"></script>
<script src="./js/studySession.js"></script>
<script src="./js/studyStats.js"></script>
<script src="./js/backup.js"></script>
<script src="./js/awards.js"></script>
<script src="./js/keyboard.js"></script>
<script src="./js/hands.js"></script>
<script src="./js/buddy.js"></script>
<script src="./js/nav.js"></script>
<script src="./js/play.js"></script>
<script src="./js/shortcut.js"></script>
<!-- 行き先（利用規約・プライバシー）。中身は 正本の 部品
     standards/web/giga-app-links.js（配布物 web/giga-app-links.js）が 出す。

     ⚠️ この アプリには フッターが 無く、画面は すべて JS が 描く。
        置き場所の <div data-giga-links> を 設定画面の 中に 置いても、
        その 画面を 開くまで 存在しないので 部品は 見つけられない。
        置き場所を 作らず、部品の 既定（画面の いちばん下に 出す）に まかせる。

     ⚠️ data-links は <script> に 書く。まだ docs/manual/ が 無いので
        「つかいかた」を 外して ある。マニュアルを 書いたら この 属性を 消す。 -->
<script src="./web/giga-app-links.js" data-links="terms,privacy" defer></script>
<script src="./js/app.js"></script>
<!-- 学習ログを記録ハブ（まなびクエスト）へ写す。読むだけで、このアプリの記録には触れない -->
<script src="./js/records-hub-client.js" defer></script>
</body>
</html>

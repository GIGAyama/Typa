<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>つながって いません — Typa（タイパ）</title>
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#eef4fb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131a24" media="(prefers-color-scheme: dark)">
<!--
  この 画面は「ネットにも つながらず、アプリ本体も 手もとに ない」ときに 出ます。
  だから **外の ファイルにも JavaScript にも たよりません**。
  色も 字も ここに 書き、読みこみ直しは ふつうの リンク（<a href>）で します
  （onclick= は CSP で 動きません）。
  見た目は 本体と そろえて あります。「こわれた」と 思わせない ためです。
-->
<style>
  :root {
    color-scheme: light dark;
    --bg: #eef4fb;
    --surface: #ffffff;
    --text: #2f3d4f;
    --muted: #4b5c70;
    --primary-deep: #2b68b4;
    --primary-ink: #ffffff;
    --line: #dbe6f3;
    --font: "BIZ UDPGothic", "BIZ UDGothic", "UD デジタル 教科書体 NP-R",
            "Hiragino Maru Gothic ProN", "ヒラギノ丸ゴ ProN", "Yu Gothic UI", "Meiryo",
            system-ui, -apple-system, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #131a24; --surface: #1e2937; --text: #e8eff8; --muted: #b9c7d8;
      --primary-deep: #8ec5ff; --primary-ink: #0b1622; --line: #35455a;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100dvh;
    display: flex; align-items: center; justify-content: center;
    padding: 24px max(16px, env(safe-area-inset-left))
             calc(24px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-right));
    background: var(--bg); color: var(--text);
    font-family: var(--font); line-height: 1.8;
    -webkit-tap-highlight-color: transparent;
  }
  @supports not (height: 100dvh) { body { min-height: 100vh; } }
  .box {
    background: var(--surface); border-radius: 1.25rem;
    box-shadow: 0 .35rem .9rem rgba(47, 61, 79, .10);
    padding: 28px 24px 26px; max-width: 420px; width: 100%; text-align: center;
  }
  .mark {
    width: 72px; height: 72px; margin: 0 auto 14px; display: block;
  }
  h1 { font-size: clamp(20px, 5vw, 26px); margin: 0 0 10px; }
  p { margin: 0 0 18px; color: var(--muted); font-size: clamp(14px, 3.6vw, 16px); }
  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    min-height: 52px; min-width: 200px; padding: 12px 24px;
    border-radius: 999px; text-decoration: none; font-weight: 800;
    background: var(--primary-deep); color: var(--primary-ink);
    font-size: clamp(15px, 4vw, 17px);
  }
  .btn:focus-visible { outline: 3px solid var(--text); outline-offset: 3px; }
  .note { margin: 18px 0 0; font-size: .84rem; }
  @media (forced-colors: active) { .btn { border: 2px solid ButtonText; } }
</style>
</head>
<body>
  <main class="box">
    <svg class="mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="2.5" y="5.5" width="19" height="13" rx="2.5"/>
      <path d="M6 9.5h.01M9.5 9.5h.01M13 9.5h.01M16.5 9.5h.01M6 13h.01M9.5 13h.01M13 13h.01M16.5 13h.01M8 16.2h8"/>
      <path d="M3 3l18 18"/>
    </svg>
    <h1>いま インターネットに つながって いません</h1>
    <p>Typa は ふだん オフラインでも れんしゅうできますが、<br>
       この 端末に まだ アプリが そろって いません。</p>
    <a class="btn" href="./">もういちど ひらく</a>
    <p class="note">つながったら、この ボタンを 押して ください。<br>
       いちど ひらいて おけば、つぎからは オフラインでも つかえます。</p>
  </main>
</body>
</html>
